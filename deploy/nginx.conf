# nginx สำหรับ production: เสิร์ฟ SPA + proxy `/api` ไปที่ container api
#
# ทำหน้าที่ป้องกันชั้นนอกด้วย:
#   - จำกัดความถี่คำขอ login ระดับ IP (ส่วนการจำกัดต่อบัญชีอยู่ใน api)
#   - จำกัดขนาดไฟล์ที่อัปโหลด
#   - security header ของหน้าเว็บ (ดู security-headers.inc — API ใช้ helmet ของตัวเอง)

# โซนนับคำขอ: 10 คำขอ/นาที ต่อ IP สำหรับ /api/auth/login (burst 5 = เผื่อกดซ้ำ)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

upstream cert_tracker_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # ขนาดไฟล์ Excel/ไฟล์แนบที่รับได้ (ต้องมากกว่า MAX_UPLOAD_SIZE_MB ของ api เล็กน้อย)
  client_max_body_size 12m;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ไม่บอกเวอร์ชัน nginx ในส่วนหัว/หน้า error
  server_tokens off;

  include /etc/nginx/conf.d/security-headers.inc;

  # ===== API =====
  location = /api/auth/login {
    limit_req zone=login_zone burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://cert_tracker_api/auth/login;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  location /api/ {
    # ตัด prefix `/api` ออกก่อนส่งต่อ (route ของ api อยู่ที่ root)
    proxy_pass http://cert_tracker_api/;
    include /etc/nginx/conf.d/proxy-headers.inc;

    # การนำเข้าไฟล์ Excel ใหญ่ๆ ใช้เวลาประมวลผลนานกว่าคำขอทั่วไป
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # ===== ไฟล์ของ SPA =====
  # ไฟล์ที่มี hash ในชื่อ (Vite) แคชได้ยาวๆ
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback: ทุก path ที่ไม่ใช่ไฟล์จริงให้คืน index.html (react-router จัดการต่อ)
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
